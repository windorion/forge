name: Swift Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: SwiftPM tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift toolchain
        run: swift --version

      - name: Check documentation truth
        run: node script/check_documentation_truth.mjs

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      - name: Print application coverage
        run: |
          COVERAGE_JSON="$(swift test --show-codecov-path)"
          COVERAGE_PROFILE="$(dirname "$COVERAGE_JSON")/default.profdata"
          TEST_BINARY="$(find .build -type f -path '*/ForgePackageTests.xctest/Contents/MacOS/ForgePackageTests' -print -quit)"
          test -f "$COVERAGE_PROFILE"
          test -n "$TEST_BINARY"
          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile="$COVERAGE_PROFILE" \
            -ignore-filename-regex='(/Tests/|\.build/)'

  mission-control-xcui-build:
    name: Mission Control XCUITest build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Build app host and UI test bundle
        run: |
          xcodebuild \
            -project ForgeApp.xcodeproj \
            -scheme ForgeAppUI \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/forge-mission-control-xcui-derived" \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
