name: macOS Distribution Posture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-boundaries:
    name: Signing boundary checks
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install Runtime build dependencies
        run: npm ci --prefix runtime

      - name: Verify policy and release-foundation fixtures
        run: |
          node --test \
            script/macos_distribution_policy_test.mjs \
            script/macos_release_foundation_test.mjs

      - name: Verify source posture
        run: |
          node script/check_macos_distribution.mjs \
            --source \
            --json-output build/distribution/source-posture.json

      - name: Build optimized unsigned signing input
        run: |
          node script/build_macos_release.mjs \
            --output "$RUNNER_TEMP/forge-release" \
            --archive "$RUNNER_TEMP/forge-release.tar.gz"

      - name: Verify release root and component evidence
        run: |
          node script/check_macos_release.mjs \
            --root "$RUNNER_TEMP/forge-release" \
            --json-output build/distribution/release-foundation.json

      - name: Prove deterministic unsigned archive serialization
        run: |
          node script/archive_macos_release.mjs \
            --root "$RUNNER_TEMP/forge-release" \
            --output "$RUNNER_TEMP/forge-release-second.tar.gz"
          cmp \
            "$RUNNER_TEMP/forge-release.tar.gz" \
            "$RUNNER_TEMP/forge-release-second.tar.gz"

      - name: Stage clean signing input
        run: |
          ./script/stage_macos_distribution.sh \
            "$RUNNER_TEMP/forge-release/Forge.app" \
            "$RUNNER_TEMP/Forge.app"
          ditto --norsrc --noextattr \
            "$RUNNER_TEMP/forge-release/forge-cli" \
            "$RUNNER_TEMP/forge-cli"
          xattr -cr "$RUNNER_TEMP/forge-cli"

      - name: Verify unsigned development boundary
        run: |
          node script/check_macos_distribution.mjs \
            --app "$RUNNER_TEMP/Forge.app" \
            --profile development-unsigned \
            --json-output build/distribution/unsigned-artifact.json

      - name: Apply explicit ad-hoc test signature
        run: |
          codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Forge.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Forge.app"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/forge-cli"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/forge-cli"

      - name: Verify ad-hoc development boundary
        run: |
          node script/check_macos_distribution.mjs \
            --app "$RUNNER_TEMP/Forge.app" \
            --profile development-ad-hoc \
            --json-output build/distribution/ad-hoc-artifact.json

      - name: Prove ad-hoc artifact is rejected as a release
        run: |
          if node script/check_macos_distribution.mjs \
            --app "$RUNNER_TEMP/Forge.app" \
            --profile developer-id-release \
            --json-output build/distribution/release-negative-control.json
          then
            echo "ad-hoc artifact unexpectedly satisfied the Developer ID release profile" >&2
            exit 1
          fi

      - name: Upload distribution posture reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-distribution-posture-${{ github.run_id }}
          path: |
            build/distribution/*.json
            ${{ runner.temp }}/forge-release/manifests/*
            ${{ runner.temp }}/forge-release.tar.gz
          if-no-files-found: error
          retention-days: 14
