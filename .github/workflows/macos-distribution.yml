name: macOS Distribution Posture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-boundaries:
    name: Signing boundary checks
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify policy fixtures
        run: node --test script/macos_distribution_policy_test.mjs

      - name: Verify source posture
        run: |
          node script/check_macos_distribution.mjs \
            --source \
            --json-output build/distribution/source-posture.json

      - name: Assemble without launching or signing
        run: ./script/build_and_run.sh --build-only

      - name: Stage clean signing input
        run: |
          ./script/stage_macos_distribution.sh \
            dist/Forge.app \
            "$RUNNER_TEMP/Forge.app"

      - name: Verify unsigned development boundary
        run: |
          node script/check_macos_distribution.mjs \
            --app "$RUNNER_TEMP/Forge.app" \
            --profile development-unsigned \
            --json-output build/distribution/unsigned-artifact.json

      - name: Apply explicit ad-hoc test signature
        run: |
          codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Forge.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Forge.app"

      - name: Verify ad-hoc development boundary
        run: |
          node script/check_macos_distribution.mjs \
            --app "$RUNNER_TEMP/Forge.app" \
            --profile development-ad-hoc \
            --json-output build/distribution/ad-hoc-artifact.json

      - name: Prove ad-hoc artifact is rejected as a release
        run: |
          if node script/check_macos_distribution.mjs \
            --app "$RUNNER_TEMP/Forge.app" \
            --profile developer-id-release \
            --json-output build/distribution/release-negative-control.json
          then
            echo "ad-hoc artifact unexpectedly satisfied the Developer ID release profile" >&2
            exit 1
          fi

      - name: Upload distribution posture reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-distribution-posture-${{ github.run_id }}
          path: build/distribution/*.json
          if-no-files-found: error
          retention-days: 14
